name: jackelineventura

on:
  push:
  pull_request:

jobs:

  build-test-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jackeline_ventura

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - run: flake8 .

      - run: pytest

  dora:
    needs: build-test-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate DORA metrics
        run: |
          echo "DORA metrics placeholder"

  deploy:
    needs: build-test-lint
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd jackeline-ventura-personal/jackeline_ventura
            git pull
            pip3 install -r requirements.txt
            nohup python3 app.py &
