name: jackelineventura

on:
  push:
  pull_request:

jobs:

  build-test-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jackeline_ventura

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint code
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest

dora:
  needs: build-test-lint
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate DORA placeholder
      run: |
        echo "DORA Metrics Placeholder"
        echo "Deployment frequency, lead time, MTTR, and change failure rate would be calculated here."

  deploy:
    needs: build-test-lint
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd jackeline-ventura-personal/jackeline_ventura
            git pull
            pip3 install -r requirements.txt
            nohup python3 app.py &
