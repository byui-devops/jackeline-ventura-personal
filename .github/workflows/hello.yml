name: Jackeline CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jackeline_ventura

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest
      - run: flake8 .

  dora:
    needs: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DORA Metrics
        uses: devops-actions/devops-metrics@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
